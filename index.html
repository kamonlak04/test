<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าแรก - เว็บไซต์ของฉัน</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            background-color: #f4f6f9;
            color: #333;
        }
        header {
            background-color: #2c3e50;
            color: #ffffff;
            padding: 1rem 0;
            text-align: center;
        }
        nav {
            margin-top: 10px;
        }
        nav a {
            color: #ffffff;
            text-decoration: none;
            margin: 0 15px;
            font-weight: 500;
        }
        nav a:hover {
            color: #3498db;
        }
        .hero {
            max-width: 800px;
            margin: 50px auto;
            padding: 40px 20px;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .hero h2 {
            margin-bottom: 15px;
            color: #2c3e50;
        }
        .btn {
            display: inline-block;
            background-color: #3498db;
            color: #ffffff;
            padding: 10px 25px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #2980b9;
        }
        footer {
            text-align: center;
            padding: 20px;
            color: #7f8c8d;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>My Website</h1>
        <nav>
            <a href="index.html">หน้าแรก</a>
            <a href="#">เกี่ยวกับเรา</a>
            <a href="#">บริการ</a>
            <a href="#">ติดต่อเรา</a>
        </nav>
    </header>

    <main class="hero">
        <h2>ยินดีต้อนรับสู่เว็บไซต์ของเรา</h2>
        <p>นี่คือหน้า index.html ตัวอย่างที่สร้างขึ้นด้วยโครงสร้าง HTML5 และตกแต่งด้วย CSS เบื้องต้น คุณสามารถแก้ไขข้อความ เพิ่มรูปภาพ หรือปรับแต่งสีตามที่ต้องการได้เลย</p>
        <a href="#" class="btn">เริ่มต้นใช้งาน</a>
    </main>

    <footer>
        <p>&copy; 2026 สงวนลิขสิทธิ์โดยเว็บไซต์ของฉัน</p>
    </footer>

</body>
</html>

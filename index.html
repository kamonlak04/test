<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เที่ยวไทย ไปไหนดี | Travel Thailand</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Prompt, sans-serif; }
    body { background-color: #f1f5f9; color: #1e293b; min-height: 100vh; padding-bottom: 40px; }
    
    /* Layout & Header */
    header { background: linear-gradient(135deg, #0284c7, #0f766e); color: white; padding: 40px 20px; text-align: center; }
    header h1 { font-size: 2.2rem; margin-bottom: 8px; }
    header p { font-size: 1rem; opacity: 0.9; }

    .container { max-width: 1100px; margin: -20px auto 0; padding: 0 20px; }
    
    /* Controls */
    .controls { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; flex-wrap: wrap; gap: 15px; justify-content: space-between; align-items: center; }
    .search-box { flex: 1; min-width: 250px; }
    .search-box input { width: 100%; padding: 10px 16px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; font-size: 0.95rem; }
    .search-box input:focus { border-color: #0284c7; }

    .filters { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-btn { border: none; background: #e2e8f0; color: #475569; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: 600; transition: 0.2s; }
    .filter-btn.active, .filter-btn:hover { background: #0284c7; color: white; }

    /* Grid & Card */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; margin-top: 30px; }
    .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.03); transition: transform 0.2s, box-shadow 0.2s; display: flex; flex-direction: column; cursor: pointer; }
    .card:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.08); }
    
    .card-img { width: 100%; height: 200px; object-fit: cover; background: #e2e8f0; }
    .card-body { padding: 18px; flex: 1; display: flex; flex-direction: column; }
    .card-tag { display: inline-block; background: #e0f2fe; color: #0369a1; font-size: 0.75rem; font-weight: bold; padding: 4px 8px; border-radius: 4px; width: fit-content; margin-bottom: 8px; }
    .card-title { font-size: 1.2rem; margin-bottom: 6px; }
    .card-location { font-size: 0.85rem; color: #64748b; margin-bottom: 12px; }
    .card-desc { font-size: 0.9rem; color: #475569; line-height: 1.5; margin-bottom: 16px; flex: 1; }
    
    .card-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #f1f5f9; padding-top: 12px; }
    .rating { color: #f59e0b; font-weight: bold; font-size: 0.9rem; }
    .btn-detail { background: #0284c7; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; font-weight: bold; cursor: pointer; }
    .fav-btn { border: none; background: transparent; cursor: pointer; font-size: 1.3rem; margin-left: 8px; }

    /* Modal Styles */
    .modal-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 20px; animation: fadeIn 0.2s ease; }
    .modal-content { background: white; border-radius: 16px; max-width: 650px; width: 100%; max-height: 90vh; overflow-y: auto; position: relative; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); animation: slideUp 0.25s ease; }
    .modal-header { position: relative; }
    .modal-img { width: 100%; height: 280px; object-fit: cover; }
    .modal-close { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.5); color: white; border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
    .modal-close:hover { background: rgba(0,0,0,0.8); }
    .modal-body { padding: 24px; }
    .modal-title { font-size: 1.6rem; margin-bottom: 4px; }
    .modal-meta { color: #64748b; font-size: 0.9rem; margin-bottom: 16px; display: flex; gap: 15px; }
    .modal-section { margin-bottom: 16px; }
    .modal-section h4 { font-size: 1rem; color: #0284c7; margin-bottom: 6px; }
    .modal-section p, .modal-section ul { color: #334155; font-size: 0.95rem; line-height: 1.6; }
    .modal-section ul { padding-left: 20px; }

    .empty-state { text-align: center; padding: 60px 20px; color: #64748b; grid-column: 1 / -1; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  </style>
</head>
<body>

  <div id="app"></div>

  <script>
    // ข้อมูลสถานที่ท่องเที่ยวแบบละเอียด
    const places = [
      {
        id: 1,
        name: 'ดอยอินทนนท์',
        location: 'เชียงใหม่',
        category: 'mountain',
        categoryText: 'ภูเขา/ธรรมชาติ',
        desc: 'ยอดเขาที่สูงที่สุดในประเทศไทย อากาศเย็นสบายตลอดปี',
        fullDesc: 'อุทยานแห่งชาติดอยอินทนนท์ มีทัศนียภาพอันงดงาม มีสภาพป่าสมบูรณ์ เป็นแหล่งกำเนิดของต้นน้ำลำธาร จุดเช็คอินยอดนิยมคือ พระมหาธาตุนภเมทนีดลและพระมหาธาตุนภพลภูมิสิริ รวมถึงเส้นทางศึกษาธรรมชาติกิ่วแม่ปาน',
        highlights: ['เดินชมทะเลหมอกกิ่วแม่ปาน', 'สักการะพระมหาธาตุคู่', 'สัมผัสอากาศหนาวเย็นยอดดอย'],
        bestTime: 'พฤศจิกายน - กุมภาพันธ์',
        rating: '★ 4.9',
        image: 'https://images.unsplash.com/photo-1589308078059-be1415eab4c3?w=800&auto=format&fit=crop',
        favorite: false
      },
      {
        id: 2,
        name: 'เกาะพีพี',
        location: 'กระบี่',
        category: 'sea',
        categoryText: 'ทะเล/เกาะ',
        desc: 'สวรรค์แห่งทะเลอันดามัน น้ำทะเลสีเขียวมรกตใสสะอาด',
        fullDesc: 'หมู่เกาะพีพีประกอบด้วย 2 เกาะใหญ่ คือ เกาะพีพีดอน และเกาะพีพีเล ที่นี่ขึ้นชื่อเรื่องอ่าวมาหยา ชายหาดโค้งสวยงามล้อมรอบด้วยอ่าวป่าเขาหินปูน และจุดดำน้ำที่อุดมสมบูรณ์ไปด้วยปะการังและสิ่งมีชีวิตใต้ทะเล',
        highlights: ['ดำน้ำตื้นชมปะการัง', 'นั่งเรือหางยาวเที่ยวอ่าวมาหยา', 'จุดชมวิวเกาะพีพีดอน'],
        bestTime: 'พฤศจิกายน - เมษายน',
        rating: '★ 4.8',
        image: 'https://images.unsplash.com/photo-1537996194471-e657df975ab4?w=800&auto=format&fit=crop',
        favorite: false
      },
      {
        id: 3,
        name: 'วัดพระแก้ว',
        location: 'กรุงเทพมหานคร',
        category: 'temple',
        categoryText: 'วัด/วัฒนธรรม',
        desc: 'วัดคู่บ้านคู่เมืองไทย ตั้งอยู่ในพระบรมมหาราชวัง',
        fullDesc: 'วัดพระศรีรัตนศาสดาราม หรือ วัดพระแก้ว เป็นวัดที่พระบาทสมเด็จพระพุทธยอดฟ้าจุฬาโลกมหาราชโปรดเกล้าฯ ให้สร้างขึ้นพร้อมกับการสถาปนากรุงรัตนโกสินทร์ เป็นที่ประดิษฐานพระพุทธมหามณีรัตนปฏิมากร (พระแก้วมรกต)',
        highlights: ['ชมจิตรกรรมฝาผนังเรื่องรามเกียรติ์', 'สักการะพระแก้วมรกต', 'ถ่ายภาพสถาปัตยกรรมไทยประเพณี'],
        bestTime: 'เที่ยวชมได้ตลอดทั้งปี (แนะนำช่วงเช้า)',
        rating: '★ 4.9',
        image: 'https://images.unsplash.com/photo-1563492065599-3520f775eeed?w=800&auto=format&fit=crop',
        favorite: false
      },
      {
        id: 4,
        name: 'เขาใหญ่',
        location: 'นครราชสีมา',
        category: 'mountain',
        categoryText: 'ภูเขา/ธรรมชาติ',
        desc: 'อุทยานแห่งชาติใกล้กรุง เหมาะแก่การแคมป์ปิ้งและส่องสัตว์',
        fullDesc: 'อุทยานแห่งชาติแห่งแรกของไทย ครอบคลุมพื้นที่ 4 จังหวัด มีอุดมสมบูรณ์ของป่าไม้และสัตว์ป่า มีน้ำตกสวยงามหลายแห่ง เช่น น้ำตกเหวนรกลอย และน้ำตกเหวสุวัต รวมถึงมีลานกางเต็นท์รับลมธรรมชาติ',
        highlights: ['ส่องสัตว์ยามค่ำคืน (Night Safari)', 'เที่ยวชมน้ำตกเหวสุวัต', 'เดินป่าศึกษาธรรมชาติ'],
        bestTime: 'ตุลาคม - กุมภาพันธ์',
        rating: '★ 4.7',
        image: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800&auto=format&fit=crop',
        favorite: false
      }
    ];

    // App State
    let currentCategory = 'all';
    let searchQuery = '';
    let selectedPlaceId = null; // เก็บ ID สำหรับการเปิด Modal

    function renderApp() {
      const filteredPlaces = places.filter(place => {
        const matchesCategory = currentCategory === 'all' || place.category === currentCategory;
        const matchesSearch = place.name.includes(searchQuery) || place.location.includes(searchQuery);
        return matchesCategory && matchesSearch;
      });

      const activeModalPlace = places.find(p => p.id === selectedPlaceId);

      document.getElementById('app').innerHTML = `
        <header>
          <h1>📍 เที่ยวไหนดี Thailand</h1>
          <p>ค้นหาและดูรายละเอียดจุดหมายปลายทางยอดนิยมทั่วไทย</p>
        </header>

        <main class="container">
          <div class="controls">
            <div class="search-box">
              <input 
                type="text" 
                placeholder="ค้นหาชื่อสถานที่ หรือจังหวัด..." 
                value="${escapeHtml(searchQuery)}"
                oninput="handleSearch(this.value)"
              />
            </div>
            <div class="filters">
              <button class="filter-btn ${currentCategory === 'all' ? 'active' : ''}" onclick="setCategory('all')">ทั้งหมด</button>
              <button class="filter-btn ${currentCategory === 'sea' ? 'active' : ''}" onclick="setCategory('sea')">ทะเล</button>
              <button class="filter-btn ${currentCategory === 'mountain' ? 'active' : ''}" onclick="setCategory('mountain')">ภูเขา</button>
              <button class="filter-btn ${currentCategory === 'temple' ? 'active' : ''}" onclick="setCategory('temple')">วัด/วัฒนธรรม</button>
            </div>
          </div>

          <div class="grid">
            ${filteredPlaces.length > 0 ? filteredPlaces.map(place => `
              <article class="card" onclick="openModal(${place.id})">
                <img class="card-img" src="${place.image}" alt="${place.name}" loading="lazy" />
                <div class="card-body">
                  <span class="card-tag">${place.categoryText}</span>
                  <h2 class="card-title">${place.name}</h2>
                  <div class="card-location">📌 ${place.location}</div>
                  <p class="card-desc">${place.desc}</p>
                  <div class="card-footer">
                    <span class="rating">${place.rating}</span>
                    <div>
                      <button class="btn-detail">ดูรายละเอียด</button>
                      <button class="fav-btn" onclick="toggleFavorite(event, ${place.id})" title="บันทึกโปรด">
                        ${place.favorite ? '❤️' : '🤍'}
                      </button>
                    </div>
                  </div>
                </div>
              </article>
            `).join('') : `
              <div class="empty-state">
                <h3>ไม่พบสถานที่ท่องเที่ยวที่ตรงกับการค้นหา</h3>
              </div>
            `}
          </div>
        </main>

        <!-- Render Modal เมื่อมีสถานที่ถูกเลือก -->
        ${activeModalPlace ? `
          <div class="modal-backdrop" onclick="closeModalOnBackdrop(event)">
            <div class="modal-content">
              <div class="modal-header">
                <img class="modal-img" src="${activeModalPlace.image}" alt="${activeModalPlace.name}" />
                <button class="modal-close" onclick="closeModal()">&times;</button>
              </div>
              <div class="modal-body">
                <span class="card-tag">${activeModalPlace.categoryText}</span>
                <h2 class="modal-title">${activeModalPlace.name}</h2>
                <div class="modal-meta">
                  <span>📌 ${activeModalPlace.location}</span>
                  <span>${activeModalPlace.rating}</span>
                </div>
                
                <div class="modal-section">
                  <h4>รายละเอียดเพิ่มเติม</h4>
                  <p>${activeModalPlace.fullDesc}</p>
                </div>

                <div class="modal-section">
                  <h4>กิจกรรมไฮไลต์ที่ไม่ควรพลาด</h4>
                  <ul>
                    ${activeModalPlace.highlights.map(h => `<li>${h}</li>`).join('')}
                  </ul>
                </div>

                <div class="modal-section">
                  <h4>ช่วงเวลาที่น่าเที่ยวที่สุด</h4>
                  <p>🗓️ ${activeModalPlace.bestTime}</p>
                </div>
              </div>
            </div>
          </div>
        ` : ''}
      `;
    }

    // Event Handlers
    function setCategory(cat) { currentCategory = cat; renderApp(); }
    function handleSearch(q) { searchQuery = q.trim(); renderApp(); }
    
    function toggleFavorite(e, id) {
      e.stopPropagation(); // ป้องกันไม่ให้การกดหัวใจไปเปิด Modal
      const target = places.find(p => p.id === id);
      if (target) { target.favorite = !target.favorite; renderApp(); }
    }

    function openModal(id) { selectedPlaceId = id; renderApp(); }
    function closeModal() { selectedPlaceId = null; renderApp(); }

    function closeModalOnBackdrop(e) {
      if (e.target.classList.contains('modal-backdrop')) closeModal();
    }

    // ปิด Modal เมื่อกดปุ่ม ESC บนคีย์บอร์ด
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && selectedPlaceId !== null) closeModal();
    });

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    renderApp();
  </script>
</body>
</html>
